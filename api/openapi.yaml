openapi: 3.1.0
info:
  title: BaseLayer API
  version: 0.1.0
  description: OpenAPI definition for the Deno HTTP API, with Go-only movie endpoints noted separately.
servers:
  - url: http://localhost:8000
    description: Local development server
tags:
  - name: Health
  - name: Auth
  - name: Projects
  - name: Project Progress
  - name: Groups
  - name: AI
  - name: Movies
    description: Movie endpoints available in the Go implementation only.
paths:
  /:
    get:
      tags:
        - Health
      summary: Root service status
      operationId: getRoot
      responses:
        "200":
          description: Service status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RootStatus"
  /health:
    get:
      tags:
        - Health
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Health status and server timestamp.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a user
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "200":
          $ref: "#/components/responses/AuthSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /auth/login:
    post:
      tags:
        - Auth
      summary: Log in a user
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "200":
          $ref: "#/components/responses/AuthSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh auth cookies
      operationId: refreshAuth
      security:
        - refreshCookie: []
      responses:
        "200":
          $ref: "#/components/responses/AuthSuccess"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /auth/logout:
    post:
      tags:
        - Auth
      summary: Log out and clear auth cookies
      operationId: logoutUser
      responses:
        "200":
          description: Refresh token revoked when present and auth cookies cleared.
          headers:
            Set-Cookie:
              description: Clears access_token and refresh_token cookies.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /me:
    get:
      tags:
        - Auth
      summary: Get the authenticated token user
      operationId: getMe
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Authenticated token payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /projects:
    get:
      tags:
        - Projects
      summary: List projects
      operationId: listProjects
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Project list.
          content:
            application/json:
              schema:
                type: object
                required:
                  - projects
                properties:
                  projects:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /projects/create:
    post:
      tags:
        - Projects
      summary: Create a project
      operationId: createProject
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: MongoDB insert result for the created project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectInsertResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /projects/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPathParam"
    get:
      tags:
        - Projects
      summary: Get a project
      operationId: getProject
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Project found.
          content:
            application/json:
              schema:
                type: object
                required:
                  - project
                properties:
                  project:
                    $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags:
        - Projects
      summary: Update a project
      operationId: updateProject
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project.
          content:
            application/json:
              schema:
                type: object
                required:
                  - project
                properties:
                  project:
                    $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - Projects
      summary: Delete a project
      operationId: deleteProject
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Project deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /projects/start:
    post:
      tags:
        - Project Progress
      summary: Start project progress
      description: The current Deno route returns HTTP 200 with a JSON status field set to 201.
      operationId: startProject
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectProgressInput"
      responses:
        "200":
          description: MongoDB insert result for the project progress document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectProgressStartResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /projects/progress:
    get:
      tags:
        - Project Progress
      summary: List project progress documents
      operationId: listProjectProgresses
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Project progress list for the authenticated user.
          content:
            application/json:
              schema:
                type: object
                required:
                  - projectProgresses
                properties:
                  projectProgresses:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProjectProgress"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /projects/progress/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPathParam"
    get:
      tags:
        - Project Progress
      summary: Get project progress with project
      operationId: getProjectProgress
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Project progress document populated with its project.
          content:
            application/json:
              schema:
                type: object
                required:
                  - projectProgress
                properties:
                  projectProgress:
                    $ref: "#/components/schemas/ProjectProgressWithProject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags:
        - Project Progress
      summary: Update project progress
      operationId: updateProjectProgress
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectProgressInput"
      responses:
        "200":
          description: Updated project progress document.
          content:
            application/json:
              schema:
                type: object
                required:
                  - projectProgress
                properties:
                  projectProgress:
                    $ref: "#/components/schemas/ProjectProgress"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /projects/progress/{id}/completed-items:
    parameters:
      - $ref: "#/components/parameters/IdPathParam"
    patch:
      tags:
        - Project Progress
      summary: Merge completed item states
      operationId: updateCompletedItems
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletedItems"
      responses:
        "200":
          description: Updated project progress document with recalculated progress.
          content:
            application/json:
              schema:
                type: object
                required:
                  - projectProgress
                properties:
                  projectProgress:
                    $ref: "#/components/schemas/ProjectProgress"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /groups:
    get:
      tags:
        - Groups
      summary: Get authenticated user's group
      operationId: getGroup
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Group found.
          content:
            application/json:
              schema:
                type: object
                required:
                  - group
                properties:
                  group:
                    $ref: "#/components/schemas/Group"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags:
        - Groups
      summary: Update authenticated user's group
      operationId: updateGroup
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupUpdate"
      responses:
        "200":
          description: Updated group.
          content:
            application/json:
              schema:
                type: object
                required:
                  - group
                properties:
                  group:
                    $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /groups/create:
    post:
      tags:
        - Groups
      summary: Create authenticated user's group
      operationId: createGroup
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupInput"
      responses:
        "201":
          description: Created group.
          content:
            application/json:
              schema:
                type: object
                required:
                  - group
                properties:
                  group:
                    $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /ai/chat:
    post:
      tags:
        - AI
      summary: Send a chat message
      operationId: chat
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatInput"
      responses:
        "200":
          description: AI-generated response text.
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /ai/extract-text:
    post:
      tags:
        - AI
      summary: Extract visible text from an image
      operationId: extractText
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImageUpload"
      responses:
        "201":
          description: Stored text extraction result.
          content:
            application/json:
              schema:
                type: object
                required:
                  - result
                properties:
                  result:
                    $ref: "#/components/schemas/AiTextExtraction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /ai/extract-receipt:
    post:
      tags:
        - AI
      summary: Extract receipt line items from an image
      operationId: extractReceipt
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImageUpload"
      responses:
        "201":
          description: Stored receipt extraction result.
          content:
            application/json:
              schema:
                type: object
                required:
                  - result
                properties:
                  result:
                    $ref: "#/components/schemas/AiReceiptExtraction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /ai/extractions:
    get:
      tags:
        - AI
      summary: List latest extraction records
      operationId: listExtractions
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Latest 20 extraction records for the authenticated user.
          content:
            application/json:
              schema:
                type: object
                required:
                  - extractions
                properties:
                  extractions:
                    type: array
                    items:
                      $ref: "#/components/schemas/AiExtraction"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /movies:
    get:
      tags:
        - Movies
      summary: List the authenticated user's movies
      description: Returns movies ordered by createdAt descending. Returns null when no movies exist.
      operationId: listMovies
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Movie list, or null when empty.
          content:
            application/json:
              schema:
                type: [array, "null"]
                items:
                  $ref: "#/components/schemas/Movie"
        "401":
          $ref: "#/components/responses/GoUnauthorized"
        "500":
          $ref: "#/components/responses/GoMovieError"
  /movies/create:
    post:
      tags:
        - Movies
      summary: Create a movie
      description: The creator is the authenticated user. The current Go handler does not validate required fields or the rating range.
      operationId: createMovie
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovieInput"
      responses:
        "201":
          description: Movie created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovieCreatedResponse"
        "401":
          $ref: "#/components/responses/GoUnauthorized"
        "500":
          $ref: "#/components/responses/GoMovieError"
  /movies/create/bulk:
    post:
      tags:
        - Movies
      summary: Create multiple movies
      description: Creates movies for the authenticated user using an ordered bulk insert. Empty input and zero ratings are rejected before any writes. Inserts are not atomic; a database error may leave earlier movies saved. Do not blindly retry a failed request.
      operationId: bulkCreateMovies
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/MovieInput"
      responses:
        "201":
          description: All movies created, with IDs in input order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkCreateMoviesResponse"
        "400":
          description: Malformed JSON, a non-array or empty body, invalid field types or dates, or a zero or missing rating.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoMessageResponse"
        "401":
          $ref: "#/components/responses/GoUnauthorized"
        "500":
          description: Bulk insert failed. Some movies may already have been saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoMessageResponse"
  /movies/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPathParam"
    get:
      tags:
        - Movies
      summary: Get a movie owned by the authenticated user
      operationId: getMovie
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Movie found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"
        "401":
          $ref: "#/components/responses/GoUnauthorized"
        "500":
          $ref: "#/components/responses/GoMovieError"
    patch:
      tags:
        - Movies
      summary: Update a movie owned by the authenticated user
      description: Omitted fields are unchanged. Non-null metadata replaces the entire metadata object rather than merging its fields. Date cannot be updated. Every successful update refreshes updatedAt.
      operationId: updateMovie
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovieUpdate"
      responses:
        "200":
          description: Updated movie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"
        "401":
          $ref: "#/components/responses/GoUnauthorized"
        "500":
          $ref: "#/components/responses/GoMovieError"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: HTTP-only access token cookie.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: HTTP-only refresh token cookie scoped to /auth/refresh.
  parameters:
    IdPathParam:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ObjectId"
  responses:
    AuthSuccess:
      description: Authenticated user; sets access_token and refresh_token cookies.
      headers:
        Set-Cookie:
          description: Includes access_token and refresh_token cookies.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthResponse"
    BadRequest:
      description: Invalid request body, id, upload, or validation failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing, invalid, or expired authentication.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Route or resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Duplicate or conflicting resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    GoUnauthorized:
      description: Missing, invalid, or expired authentication in the Go implementation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GoMessageResponse"
    GoMovieError:
      description: The Go movie handlers currently return HTTP 500 for decoding errors, invalid IDs, missing movies, permission failures, and database errors.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GoMessageResponse"
  schemas:
    GoMessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
      additionalProperties: false
    MovieCreatedResponse:
      type: object
      required:
        - id
        - message
      properties:
        id:
          $ref: "#/components/schemas/ObjectId"
        message:
          type: string
          const: movie created
      additionalProperties: false
    BulkCreateMoviesResponse:
      type: object
      required:
        - ids
        - message
      properties:
        ids:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ObjectId"
        message:
          type: string
          const: movies created
      additionalProperties: false
    MovieRating:
      type: integer
      not:
        const: 0
      description: Non-zero movie rating. Single-movie creation does not currently enforce this constraint; bulk creation rejects zero ratings.
      example: 8
    MovieMetadata:
      type: object
      description: Movie metadata using the current Go field types. Omitted fields receive their Go zero values; omitted slices are returned as null.
      properties:
        id:
          type: integer
        overview:
          type: string
        original_language:
          type: string
        original_title:
          type: string
        video:
          type: boolean
        title:
          type: string
        genre_ids:
          type: [array, "null"]
          items:
            type: string
        poster_path:
          type: [array, "null"]
          items:
            type: string
        backdrop_path:
          type: [array, "null"]
          items:
            type: string
        release_date:
          type: string
        vote_average:
          type: number
          format: double
        popularity:
          type: number
          format: double
        adult:
          type: boolean
        vote_count:
          type: integer
      additionalProperties: true
    MovieInput:
      type: object
      required:
        - date
        - metadata
        - rating
      properties:
        date:
          $ref: "#/components/schemas/IsoDateTime"
        metadata:
          $ref: "#/components/schemas/MovieMetadata"
        rating:
          $ref: "#/components/schemas/MovieRating"
      additionalProperties: true
    MovieUpdate:
      type: object
      properties:
        metadata:
          description: Omit or send null to preserve existing metadata. An object replaces all metadata, including when empty.
          anyOf:
            - $ref: "#/components/schemas/MovieMetadata"
            - type: "null"
        rating:
          $ref: "#/components/schemas/MovieRating"
          description: Omit to preserve the current rating. The current Go implementation also ignores zero.
      additionalProperties: true
    Movie:
      allOf:
        - $ref: "#/components/schemas/MovieInput"
        - type: object
          required:
            - id
            - creatorId
            - createdAt
            - updatedAt
          properties:
            id:
              $ref: "#/components/schemas/ObjectId"
            creatorId:
              $ref: "#/components/schemas/ObjectId"
            createdAt:
              $ref: "#/components/schemas/IsoDateTime"
            updatedAt:
              $ref: "#/components/schemas/IsoDateTime"
    ObjectId:
      type: string
      pattern: ^[0-9a-fA-F]{24}$
      example: "667000000000000000000000"
    IsoDateTime:
      type: string
      format: date-time
      example: "2026-06-22T12:00:00.000Z"
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
      additionalProperties: false
    OkResponse:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
          const: true
      additionalProperties: false
    RootStatus:
      type: object
      required:
        - name
        - status
      properties:
        name:
